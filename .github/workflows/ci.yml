name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ["4.14", "5.2"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - name: Install dependencies
        run: opam install --yes dune menhir ounit2
      - name: Build
        run: opam exec -- dune build
      - name: Test
        run: opam exec -- dune test
      - name: Smoke-test the CLI
        run: |
          opam exec -- dune exec ./qam.exe -- compile examples/qam/teleport.qam
          opam exec -- dune exec ./qam.exe -- simulate examples/qam/teleport.qam
